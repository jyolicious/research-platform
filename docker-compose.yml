version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: research_postgres
    restart: always
    environment:
      POSTGRES_DB: research_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: research_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data: